{% extends "base.html" %}

{% block style %}
		form {
			padding-left: 15px;
		}

		form > * {
			display: block;
			margin-top: 0;
			margin-bottom: 1rem;
		}
{% endblock %}

{% block title %} Telefono Home Page {% endblock %}

{% block content%}
	<form method="post">
		<label for="number">Nummer die anrufen soll:</label>
		<input type="text" inputmode="numeric" pattern="[0-9]+" title="nur Ziffern (0-9)" id="number" name="nm" />
		<input type="submit" class="button blue" value="let it call"/>
	</form>
{% endblock %}
