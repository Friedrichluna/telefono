{% extends "base.html" %}

{% block title %}Text ansagen{% endblock %}

{% block content %}
	<h2>Text ansagen</h2>
	<form method="post" class="stacked" data-async data-reset>
		<label for="text">Anzusagender Text:</label>
		<textarea id="text" name="text" maxlength="{{ text_max }}" required autofocus>{{ text }}</textarea>
		<input type="submit" class="button primary" value="Ansagen">
	</form>
{% endblock %}
