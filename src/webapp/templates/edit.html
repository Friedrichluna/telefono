{% extends "base.html" %}

{% block title %}Nummer {{ number }} bearbeiten{% endblock %}

{% block content %}
	<h2>Nummer {{ number }} bearbeiten</h2>
	<form method="post" class="stacked">
		<label for="new_value">Beschreibung:</label>
		<input type="text" id="new_value" name="new_value" value="{{ value }}" maxlength="{{ description_max }}" required autofocus>
		<div>
			<input type="submit" class="button blue" value="Speichern">
			<a href="{{ url_for('list') }}#n{{ number }}" class="button light">Abbrechen</a>
		</div>
	</form>
{% endblock %}
