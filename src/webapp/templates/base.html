<!DOCTYPE html>
<html>
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

	<style>
		:root {
			color: #212529;
			background-color: white;

			--blue: #007bff;
			--indigo: #6610f2;
			--purple: #6f42c1;
			--pink: #e83e8c;
			--red: #dc3545;
			--orange: #fd7e14;
			--yellow: #ffc107;
			--green: #28a745;
			--teal: #20c997;
			--cyan: #17a2b8;
			--gray: #6c757d;
			--gray-dark: #343a40;

			--primary: var(--blue);
			--secondary: var(--gray);

			--success: var(--green);
			--info: var(--info);
			--warning: var(--yellow);
			--danger: var(--red);
			--light: #f8f9fa;
			--dark: var(--gray-dark);

			--breakpoint-xs: 0;
			--breakpoint-sm: 576px;
			--breakpoint-md: 768px;
			--breakpoint-lg: 992px;
			--breakpoint-xl: 1200px;
			--font-family-sans-serif: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
			--font-family-monospace: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
		}

		body {
			margin: 0;

			font-family: var(--font-family-sans-serif);
			font-size: 1rem;
			font-weight: 400;
			line-height: 1.5;
		}

		h1 {
			font-size: 2.5rem;
			margin-top: 0;
			margin-bottom: .5rem;
			font-weight: 500;
			line-height: 1.2;
		}

		input {
			font-family: inherit;
			font-size: inherit;
			line-height: inherit;
		}

		#message {
			margin: 10px 15px;
			padding: 10px;
			border-radius: 3px;
		}

		#message:target {
			display:none;
		}

		#message > a {
			float: right;
			color: inherit;
			text-decoration: inherit;
		}

		#message.info {
			color: #059;
			background-color: #BEF;
		}

		#message.info::before {
		  content: "\1F6C8 ";
		}

		#message.success {
			color: #270;
			background-color: #DFF2BF;
		}

		#message.success::before {
		  content: "\2714 ";
		}

		#message.warning {
			color: #9F6000;
			background-color: #FEEFB3;
		}

		#message.warning::before {
		  content: "\26A0 ";
		}

		#message.error {
			color: #D8000C;
			background-color: #FFBABA;
		}

		#message.error::before {
		  content: "\274C ";
		}

		[type="submit"] {
			cursor: pointer;
		}

		/* primary navbar */
		nav {
			border-bottom: 1px solid #dee2e6;
		}

		nav > a {
			display: inline-block;
			margin-bottom: -1px;
			padding: .5rem 1rem;

			color: var(--primary);
			text-decoration: none;

			border: 1px solid transparent;
			border-top-left-radius: .25rem;
			border-top-right-radius: .25rem;
		}

		nav > a.active {
			color: #495057;
			border-color: #dee2e6;
			border-bottom-color: white;
		}

		nav > a:focus:not(.active), nav > a:hover:not(.active) {
			color: #0056b3;
			border-color: #e9ecef;
			border-bottom-color: #dee2e6;
		}


		/* general buttons */
		.button {
			display: inline-block;

			text-decoration: none;
			text-align: center;
			font-weight: 400;
			vertical-align: middle;

			color: white;

			border: 1px solid transparent;
			transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
		}

		.button.blue {
			background-color: var(--primary);
			border-color: var(--primary);
		}
		.button.blue:hover {
			background-color: #0069d9;
			border-color: #0062cc;
		}
		.button.blue:focus {
			box-shadow: 0 0 0 .2rem rgba(0,123,255,.25);
		}
		.button.blue:active {
			background-color: #0062cc;
			border-color: #005cbf;
		}
{% block style %}
{% endblock %}
	</style>
	<title>{% block title%}{% endblock %}</title>
</head>
<body>
	<h1>Telefon-Webapp</h1>
{% if message %}
	<p id="message" class="{{ message_type }} ">{{ message }}
		<a href="#message">&#10006;</a>
	</p>
{% endif %}
{% if request.endpoint != 'edit_value' %}
	<nav>
		<a {% if request.path == url_for('home') %}class="active"{% endif %} href={{ url_for('home') }}>Nummernfeld </a>
		<a {% if request.path == url_for('list') %}class="active"{% endif %} href={{ url_for('list') }}>Liste</a>
		<a {% if request.path == url_for('upload_page') %}class="active"{% endif %} href={{ url_for('upload_page') }}>Upload</a>
		<a {% if request.path == url_for('say') %}class="active"{% endif %} href={{ url_for('say') }}>Text ansagen</a>
	</nav>
{% endif %}
	{% block content %}
	{% endblock %}
</body>
</html>
