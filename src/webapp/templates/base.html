<!DOCTYPE html>
<html>
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">

	<style>
		:root {
			color: #212529;
			background-color: white;

			--blue: #007bff;
			--indigo: #6610f2;
			--purple: #6f42c1;
			--pink: #e83e8c;
			--red: #dc3545;
			--orange: #fd7e14;
			--yellow: #ffc107;
			--green: #28a745;
			--teal: #20c997;
			--cyan: #17a2b8;
			--gray: #6c757d;
			--gray-dark: #343a40;

			--primary: var(--blue);
			--secondary: var(--gray);

			--success: var(--green);
			--info: var(--info);
			--warning: var(--yellow);
			--danger: var(--red);
			--light: #f8f9fa;
			--dark: var(--gray-dark);

			--breakpoint-xs: 0;
			--breakpoint-sm: 576px;
			--breakpoint-md: 768px;
			--breakpoint-lg: 992px;
			--breakpoint-xl: 1200px;
			--font-family-sans-serif: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
			--font-family-monospace: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
		}

		body {
			margin: 0;

			font-family: var(--font-family-sans-serif);
			font-size: 1rem;
			font-weight: 400;
			line-height: 1.5;
		}

		h1 {
			position: relative;
			top: 1px;
			margin: .3125rem 16px .3125rem 0;
			display: inline;
			font-size: 1.25rem;
			font-weight: 400;
			line-height: 1.5;
		}

		h1::before {
			margin-right: 5px;
			content: " ";
			display: inline-block;
			width: 30px;
			height: 24px;
			background-image: url("/static/favicon.ico");
			background-size: 100% 100%;
			vertical-align: text-top;
		}

		input {
			font-family: inherit;
			font-size: inherit;
			line-height: inherit;
		}

		#message {
			margin: 10px 15px;
			padding: 10px;
			border-radius: 3px;
		}

		#message:target {
			display:none;
		}

		#message > a {
			float: right;
			color: inherit;
			text-decoration: inherit;
		}

		#message.info {
			color: #059;
			background-color: #BEF;
		}

		#message.info::before {
		  content: "\1F6C8 ";
		}

		#message.success {
			color: #270;
			background-color: #DFF2BF;
		}

		#message.success::before {
		  content: "\2714 ";
		}

		#message.warning {
			color: #9F6000;
			background-color: #FEEFB3;
		}

		#message.warning::before {
		  content: "\26A0 ";
		}

		#message.error {
			color: #D8000C;
			background-color: #FFBABA;
		}

		#message.error::before {
		  content: "\274C ";
		}

		[type="submit"] {
			cursor: pointer;
		}

		/* primary navbar */
		nav {
			display: grid;
			grid-template-columns: repeat(2, auto);
			justify-content: space-between;
			padding: 8px 16px;
			background-color: #f8f9fa;
		}

		nav a {
			display: block;
			padding: 8px 0;

			color: rgba(0,0,0,.5);
			text-decoration: none;
		}

		nav a.active {
			color: rgba(0,0,0,.9);
		}

		nav a:focus:not(.active), nav a:hover:not(.active) {
			color: rgba(0,0,0,.7);
		}

		details {
			display: contents;
		}

		summary {
			display: block;
			width: 1.5em;
			height: 1.5em;
			padding: .25rem .75rem;

			border-style: solid;
			border-width: 1px;
			border-radius: .25rem;
			border-color: rgba(0,0,0,.1);

			font-size: 1.25rem;
			appearance: button;
			cursor: pointer;
		}

		details > *:not(summary) {
			grid-column: 1;
		}

		@media not (prefers-reduced-motion:reduce)
		{
			@keyframes menu-open {
				from {
					max-height: 0;
				}

				to {
					max-height: 200px;
				}
			}

			div {
				overflow: hidden;
			}

			details[open] > div {
				animation-name: menu-open;
				animation-duration: .4375s;
				animation-timing-function: ease;
				animation-fill-mode: forwards;
			}
		}

		@media screen and (min-width: 900px) {
			summary {
				display: none;
			}

			nav {
				display: block;
			}

			nav div {
				display: contents;
			}

			nav a {
				display: inline-block;
				padding: 8px;
			}
		}

		/* general buttons */
		.button {
			display: inline-block;

			text-decoration: none;
			text-align: center;
			font-weight: 400;
			vertical-align: middle;

			color: white;

			border: 1px solid transparent;
			transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
		}

		.button.blue {
			background-color: var(--primary);
			border-color: var(--primary);
		}
		.button.blue:hover {
			background-color: #0069d9;
			border-color: #0062cc;
		}
		.button.blue:focus {
			box-shadow: 0 0 0 .2rem rgba(0,123,255,.25);
		}
		.button.blue:active {
			background-color: #0062cc;
			border-color: #005cbf;
		}
{% block style %}
{% endblock %}
	</style>
	<title>{% block title%}{% endblock %}</title>
</head>
<body>
{% if message %}
	<p id="message" class="{{ message_type }} ">{{ message }}
		<a href="#message">&#10006;</a>
	</p>
{% endif %}
{% if request.endpoint != 'edit_value' %}
	<nav>
		<h1>Telefono-Webapp</h1>
		<details open>
			<summary>
				<svg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'>
					<path stroke='rgba(0, 0, 0, 0.5)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/>
				</svg>
			</summary>
			<div>
				<a {% if request.path == url_for('home') %}class="active" {% endif %}href={{ url_for('home') }}>Nummernfeld </a>
				<a {% if request.path == url_for('list') %}class="active" {% endif %}href={{ url_for('list') }}>Liste</a>
				<a {% if request.path == url_for('upload_page') %}class="active" {% endif %}href={{ url_for('upload_page') }}>Upload</a>
				<a {% if request.path == url_for('say') %}class="active" {% endif %}href={{ url_for('say') }}>Text ansagen</a>
			</div>
		</details>
	</nav>
{% endif %}
	{% block content %}
	{% endblock %}
</body>
</html>
