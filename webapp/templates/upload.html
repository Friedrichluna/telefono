{% extends "base.html" %}
{% block title %} Telefono Home Page {% endblock %}
{% block content%}
	<nav class="_my-nav">
		<a href="/">Nummernfeld </a>
		<a href="/list">Liste</a>
		<a class="active" href="/upload">Upload</a>
	</nav>

		<form class="_my-form" method="post" enctype="multipart/form-data">
			<b style="display: block;">Hier kann eine .wav Datei hochgeladen werden</b>
			<input type=file name=file>
			<label class="_my-label" for="requestedNumber">gewünschte Nummer:</label>
			<input type="number" name="requestedNumber" min=0 >
			<input type="submit" class="_my-button _my-blue" value="Hochladen">
		{% if content %}
			<p>{{content}}</p>
		{% endif %}
			<p>Freier Speicher: {{diskSpace}} GiB</p>
		</form>
{% endblock %}
