{% extends "base.html" %}
{% block title %} Telefono Home Page {% endblock %}
{% block content%}
	<nav>
		<a href="/">Nummernfeld </a>
		<a href="/list">Liste</a>
		<a class="active" href="/upload">Upload</a>
	</nav>

		<form method="post" enctype="multipart/form-data">
			<p class="instruction">Hier kann eine .wav Datei hochgeladen werden</p>
			<input type=file name=file>
			<label for="requestedNumber">gewünschte Nummer:</label>
			<input type="number" name="requestedNumber" min=0 >
			<input type="submit" class="upload button blue" value="Hochladen">
		{% if content %}
			<p>{{content}}</p>
		{% endif %}
			<p>Freier Speicher: {{diskSpace}} GiB</p>
		</form>
{% endblock %}
