{% extends "base.html" %}
{% block title %} Telefono Home Page {% endblock %}
{% block content%}
	<nav>
		<a href="/">Nummernfeld </a>
		<a class="active" href="/list">Liste</a>
		<a href="/upload">Upload</a>
	</nav>
{% for number in records %}
	<section>
		<form action="/get_value" method="post">
			<input type="submit" name="selected_value" value="{{ number }}" class="button gray">
		</form>
		{{ records[number] }}
		<a href="/edit/{{ number }}" class="button blue">✎</a>
	</section>
{% endfor %}

{% endblock %}
