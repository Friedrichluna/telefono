{% extends "base.html" %}
{% block title %} Telefono Home Page {% endblock %}
{% block content%}
	<nav class="_my-nav">
		<a href="/">Nummernfeld </a>
		<a class="active" href="/list">Liste</a>
		<a href="/upload">Upload</a>
	</nav>
{% for number in records %}
	<section class="_my-item">
		<form action="/get_value" method="post">
			<input type="submit" name="selected_value" value="{{ number }}" class="_my-button _my-number">
		</form>
		{{ records[number] }}
		<a href="/edit/{{ number }}" class="_my-button _my-edit">✎</a>
	</section>
{% endfor %}

{% endblock %}
