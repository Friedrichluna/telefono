{% extends "base.html" %}
{% block title %} Telefono Home Page {% endblock %}
{% block content%}
	<ul class="nav nav-tabs">
		<li class="nav-item">
			<a class="nav-link" href="/">Nummernfeld </a>
		</li>
		<li class="nav-item">
			<a class="nav-link active" href="/list">Liste</a>
		</li>
		<li class="nav-item">
			<a class="nav-link" href="/upload">Upload</a>
		</li>
	</ul>
	<ul class="list-group">
		{% for key in messageNamesList %}
			<li class="list-group-item d-flex justify-content-between align-items-center">
				<div class="text-left">
					<form action="/get_value" method="post" class="d-inline">
						<button type="submit" name="selected_value" value="{{ key }}" class="btn btn-sm btn-secondary">{{ key }}</button>
					</form>

					{{messageNamesList[key]}}
				</div>

				<div class="text-right btn-group">
					<a href="/edit/{{ key }}" class="btn btn-sm btn-primary">✎</a>
				</div>
			</li>


		{% endfor %}
	</ul>
{% endblock %}
