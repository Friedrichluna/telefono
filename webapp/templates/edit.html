<!DOCTYPE html>
<html>
<head>
	<title>Edit Value</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
	<style>

		body {
			margin-top: 3rem !important;
			width: 100%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;
			margin-left: auto;
		}

		@media (min-width:576px){
			body {
				max-width:540px;
			}
		}
		@media (min-width:768px){
			body {
				max-width:720px;
			}
		}
		@media (min-width:992px){
			body {
				max-width:960px;
			}
		}
		@media (min-width:1200px){
			body {
				max-width:1140px;
			}
		}

		input {
			margin-bottom: 1rem;
		}
	</style>
</head>
<body>
	<h2>Namen Bearbeiten</h2>
	<form method="post">
		<label for="new_value">Neuer Name:</label>
		<input type="text" class="form-control" id="new_value" name="new_value" value="{{ value }}" required>
		<input type="submit" class="btn btn-primary" value="Speichern">
	</form>
</body>
</html>
