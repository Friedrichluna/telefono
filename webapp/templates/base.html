<!DOCTYPE html>
<html>
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

	<style>
		._my-input {
			display: block;
		}

		[type="button"]:not(:disabled), [type="reset"]:not(:disabled), [type="submit"]:not(:disabled), button:not(:disabled) {
			cursor: pointer;
		}

		._my-form {
			width: 100%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;
			margin-left: auto;
		}
		._my-form > * {
			display: block;
			margin-top: 0;
			margin-bottom: 1rem;
		}
		._my-nav {
			display: -ms-flexbox;
			display: flex;
			-ms-flex-wrap: wrap;
			flex-wrap: wrap;
			padding-left: 0;
			margin-bottom: 0;
			list-style: none;
			border-bottom: 1px solid #dee2e6;
		}
		._my-nav > .active {
			color: #495057;
			background-color: #fff;
			border-color: #dee2e6 #dee2e6 #fff;
		}
		._my-nav > a {
			color: #007bff;
			text-decoration: none;
			background-color: transparent;
			display: block;
			padding: .5rem 1rem;
			border: 1px solid transparent;
			border-top-left-radius: .25rem;
			border-top-right-radius: .25rem;
			margin-bottom: -1px;
		}
		._my-nav > a:focus:not(.active), ._my-nav > a:hover:not(.active) {
			border-color: #e9ecef #e9ecef #dee2e6;
			color: #0056b3;
		}


		._my-button {
			padding: .25rem .5rem;
			font-size: .875rem;
			line-height: 1.5;
			border-radius: .2rem;

			display: inline-block;
			font-weight: 400;
			text-align: center;
			vertical-align: middle;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			border: 1px solid transparent;
			transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
		}
		._my-button:hover {
			color: #212529;
			text-decoration: none;
		}
		._my-number {
			color: #fff;
			background-color: #6c757d;
			border-color: #6c757d;
		}
		._my-number:hover {
			color: #fff;
			background-color: #5a6268;
			border-color: #545b62;
		}
		._my-number:active {
			color: #fff;
			background-color: #545b62;
			border-color: #4e555b;
		}
		._my-number:focus, ._my-number:active:focus {
			box-shadow: 0 0 0 .2rem rgba(130,138,145,.5);
		}
		._my-edit {
			float: right;
		}
		._my-blue {
			color: #fff;
			background-color: #007bff;
			border-color: #007bff;
		}
		._my-blue:hover {
			color: #fff;
			background-color: #0069d9;
			border-color: #0062cc;
		}
		._my-blue:focus {
			outline: 0;
			box-shadow: 0 0 0 .2rem rgba(0,123,255,.25);
		}
		._my-blue:active {
			color: #fff;
			background-color: #0062cc;
			border-color: #005cbf;
		}
		._my-item {
			padding: .75rem 1.25rem;
			margin-bottom: -1px;
			background-color: #fff;
			border: 1px solid rgba(0,0,0,.125);
		}
		._my-item > form {
			display: contents;
		}


		._my-label {
			display: block;
			margin-bottom: .5rem;
			font-weight: bolder;
		}
		._my-form > ._my-button {
			padding: .375rem .75rem;
			font-size: 1rem;
			line-height: 1.5;
			border-radius: .25rem;
		}
	</style>
	<title>{% block title%}{% endblock %}</title>
</head>
<body>
	<h1>Telefon-Webapp</h1>
	{% block content %}
	{% endblock %}
</body>
</html>
