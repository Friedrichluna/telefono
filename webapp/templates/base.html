<!DOCTYPE html>
<html>
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<style>
		:root {
			--blue: #007bff;
			--indigo: #6610f2;
			--purple: #6f42c1;
			--pink: #e83e8c;
			--red: #dc3545;
			--orange: #fd7e14;
			--yellow: #ffc107;
			--green: #28a745;
			--teal: #20c997;
			--cyan: #17a2b8;
			--white: #fff;
			--gray: #6c757d;
			--gray-dark: #343a40;
			--primary: #007bff;
			--secondary: #6c757d;
			--success: #28a745;
			--info: #17a2b8;
			--warning: #ffc107;
			--danger: #dc3545;
			--light: #f8f9fa;
			--dark: #343a40;
			--breakpoint-xs: 0;
			--breakpoint-sm: 576px;
			--breakpoint-md: 768px;
			--breakpoint-lg: 992px;
			--breakpoint-xl: 1200px;
			--font-family-sans-serif: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
			--font-family-monospace: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
		}
		*, ::after, ::before {
			box-sizing: border-box;
		}
		body {
			margin: 0;
			font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
			font-size: 1rem;
			font-weight: 400;
			line-height: 1.5;
			color: #212529;
			text-align: left;
			background-color: #fff;
		}

		h1 {
			font-size: 2.5rem;
		}
		h1, h2, h3, h4, h5, h6 {
			margin-top: 0;
			margin-bottom: .5rem;
			font-weight: 500;
			line-height: 1.2;
		}
		b, strong {
			font-weight: bolder;
		}
		button, input {
			overflow: visible;
		}
		button, input, optgroup, select, textarea {
			margin: 0;
			font-family: inherit;
			font-size: inherit;
			line-height: inherit;
		}
		p {
			margin-top: 0;
			margin-bottom: 1rem;
		}
		button, select {
			text-transform: none;
		}
		a {
			text-decoration: none;
		}
		[type="button"]::-moz-focus-inner, [type="reset"]::-moz-focus-inner, [type="submit"]::-moz-focus-inner, button::-moz-focus-inner {
			padding: 0;
			border-style: none;
		}



		._my-input {
			display: block;
		}

		[type="button"]:not(:disabled), [type="reset"]:not(:disabled), [type="submit"]:not(:disabled), button:not(:disabled) {
			cursor: pointer;
		}

		._my-form {
			width: 100%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;
			margin-left: auto;
		}
		._my-form > * {
			display: block;
			margin-top: 0;
			margin-bottom: 1rem;
		}
		._my-nav {
			display: -ms-flexbox;
			display: flex;
			-ms-flex-wrap: wrap;
			flex-wrap: wrap;
			padding-left: 0;
			margin-bottom: 0;
			list-style: none;
			border-bottom: 1px solid #dee2e6;
		}
		._my-nav > .active {
			color: #495057;
			background-color: #fff;
			border-color: #dee2e6 #dee2e6 #fff;
		}
		._my-nav > a {
			color: #007bff;
			text-decoration: none;
			background-color: transparent;
			display: block;
			padding: .5rem 1rem;
			border: 1px solid transparent;
			border-top-left-radius: .25rem;
			border-top-right-radius: .25rem;
			margin-bottom: -1px;
		}
		._my-nav > a:focus:not(.active), ._my-nav > a:hover:not(.active) {
			border-color: #e9ecef #e9ecef #dee2e6;
			color: #0056b3;
		}


		._my-button {
			padding: .25rem .5rem;
			font-size: .875rem;
			line-height: 1.5;
			border-radius: .2rem;

			display: inline-block;
			font-weight: 400;
			text-align: center;
			vertical-align: middle;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			border: 1px solid transparent;
			transition: color .15s ease-in-out,background-color .15s ease-in-out,border-color .15s ease-in-out,box-shadow .15s ease-in-out;
		}
		._my-button:hover {
			color: #212529;
			text-decoration: none;
		}
		._my-number {
			color: #fff;
			background-color: #6c757d;
			border-color: #6c757d;
		}
		._my-number:hover {
			color: #fff;
			background-color: #5a6268;
			border-color: #545b62;
		}
		._my-number:active {
			color: #fff;
			background-color: #545b62;
			border-color: #4e555b;
		}
		._my-number:focus, ._my-number:active:focus {
			box-shadow: 0 0 0 .2rem rgba(130,138,145,.5);
		}
		._my-edit {
			float: right;
		}
		._my-blue {
			color: #fff;
			background-color: #007bff;
			border-color: #007bff;
		}
		._my-blue:hover {
			color: #fff;
			background-color: #0069d9;
			border-color: #0062cc;
		}
		._my-blue:focus {
			outline: 0;
			box-shadow: 0 0 0 .2rem rgba(0,123,255,.25);
		}
		._my-blue:active {
			color: #fff;
			background-color: #0062cc;
			border-color: #005cbf;
		}
		._my-item {
			padding: .75rem 1.25rem;
			margin-bottom: -1px;
			background-color: #fff;
			border: 1px solid rgba(0,0,0,.125);
		}
		._my-item > form {
			display: contents;
		}


		._my-label {
			display: block;
			margin-bottom: .5rem;
			font-weight: bolder;
		}
		._my-form > ._my-button {
			padding: .375rem .75rem;
			font-size: 1rem;
			line-height: 1.5;
			border-radius: .25rem;
		}
	</style>
	<title>{% block title%}{% endblock %}</title>
</head>
<body>
	<h1>Telefon-Webapp</h1>
	{% block content %}
	{% endblock %}
</body>
</html>
